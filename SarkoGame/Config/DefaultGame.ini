[/Script/SarkoGame.SarkoRaidSettings]
; RaidDurationSeconds is deliberately ABSENT. It used to say 480 here while
; bridge.json says 900, and ASarkoRaidGameMode::MapClockSeconds prefers the map's
; value — so the ini line was dead config that read like truth for two stages.
; The C++ default stands as the fallback for a map that carries no duration.
MapExtent=20000.000000
MapId=bridge
; The hole the local player carries through the forest roof. See the property's
; own comment for where 1000 comes from — it is derived from the camera boom, not
; picked. This section is [/Script/SarkoGame.SarkoRaidSettings] in DefaultGAME.ini
; because USarkoRaidSettings is UCLASS(config = Game); the same line in
; DefaultEngine.ini would load nothing, warn about nothing, and leave the C++
; default in place looking exactly like success.
CanopyFadeRadiusUU=1000.000000
; 440 since the realism stage: the authored route is ~95,000 uu of walking, and
; 10% off a four-minute walk is forty seconds of nothing removed.
WalkSpeed=440.000000
MoveStickDeadZone=0.150000
AimConeHalfAngleDegrees=6.000000
WeaponRangeUU=4000.000000
; 28, not 12. One number serves both sides, and at 12 a bot took nine of the
; player's shots and needed fifteen seconds to kill them — a firefight you could
; walk away from. At 28 it is four shots either way: damage that matters, and no
; bullet sponges.
WeaponDamage=28.000000
; Eight, because it IS a Пістолет ПМ. Thirty rounds was 3.6 bots per magazine and
; a reload that never arrived; eight makes the reload a rhythm and the ammo on the
; route worth picking up.
MagazineSize=8
; 1.8: with the auto-reload safety net gone, a manual-only reload at 2.2 s reads
; as punishment rather than as a decision.
ReloadSeconds=1.800000
; The tutorial's reload lesson, and the only one it costs nothing to teach.
; Auto-reload is gone (spec §3), so the button's empty-state pulse has to appear
; somewhere safe before it appears under fire. Three rounds means it appears at
; the spawn camp. Set it to -1 for a full magazine once raids stop teaching.
StartingMagazineRounds=3
MinFireIntervalSeconds=0.150000
AimFireDeadZone=0.350000
PocketGrid=(X=2,Y=2)
BackpackGrid=(X=4,Y=2)
InteractRadiusUU=250.000000
LootChannelSeconds=1.500000
ExtractDwellSeconds=5.000000
bOfflineTutorialLoot=True
PostRaidReturnSeconds=5.000000
bBackendEnabled=True
; Quoted deliberately: the ini parser runs with SwallowDoubleSlashComments, so an
; unquoted value is truncated at the "//" of the scheme and the setting silently
; becomes "https:". Quotes suppress comment handling and are stripped from the
; value (FParse::QuotedString), so this loads as the full URL.
BackendBaseUrl="https://sarko-api-production.up.railway.app"
BackendMapId=bridge
BackendGraceMarginSeconds=120.000000
BackendTimeoutSeconds=10.000000
; The FALLBACK hearing radius, for a bot with no archetype (map `botSpawns`).
; Every encounter-spawned bot gets its own from SarkoAI::GetBotArchetypes via
; ASarkoAIController::SetPerception, so this number no longer decides the
; tutorial's fights at all — but it must not contradict them either. 1400 is
; scav_pistol's row: 1800 was wider than the screen in every direction, which is
; a fight that starts off-screen.
EnemyHearingRadiusUU=1400.000000
; Its own setting since the realism stage. It used to be WeaponRangeUU * 0.5 in
; SarkoAIController, i.e. 2000 uu, against a screen about 1090 uu across at the
; pawn's depth — so the first shot of a raid arrived from a bot the player could
; not see. 1100 sits inside the ~1380 uu of forward view, so a fight starts on
; screen or not at all (ТЗ §11).
EnemyFiringRangeUU=1100.000000
AIPatrolLeashUU=1400.000000
AIInvestigateArriveRadiusUU=250.000000
AIInvestigateTimeoutSeconds=12.000000
EncounterEvaluationIntervalSeconds=0.250000
EncounterMinSpawnDistanceUU=1800.000000
EncounterSpawnDeferSeconds=5.000000
