[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=A1B2C3D4E5F60718293A4B5C6D7E8F90
ProjectName=Sarko

[/Script/SarkoGame.SarkoRaidSettings]
; RaidDurationSeconds is deliberately ABSENT. It used to say 480 here while
; bridge.json says 900, and ASarkoRaidGameMode::MapClockSeconds prefers the map's
; value — so the ini line was dead config that read like truth for two stages.
; The C++ default stands as the fallback for a map that carries no duration.
MapExtent=20000.000000
MapId=bridge
; The hole the local player carries through the forest roof. See the property's
; own comment for where 1000 comes from — it is derived from the camera boom, not
; picked. This section is [/Script/SarkoGame.SarkoRaidSettings] in DefaultGAME.ini
; because USarkoRaidSettings is UCLASS(config = Game); the same line in
; DefaultEngine.ini would load nothing, warn about nothing, and leave the C++
; default in place looking exactly like success.
CanopyFadeRadiusUU=1000.000000
; 440 since the realism stage: the authored route is ~95,000 uu of walking, and
; 10% off a four-minute walk is forty seconds of nothing removed.
WalkSpeed=440.000000
MoveStickDeadZone=0.150000
AimConeHalfAngleDegrees=6.000000
WeaponRangeUU=4000.000000
; 28, not 12. One number serves both sides, and at 12 a bot took nine of the
; player's shots and needed fifteen seconds to kill them — a firefight you could
; walk away from. At 28 it is four shots either way: damage that matters, and no
; bullet sponges.
WeaponDamage=28.000000
; Eight, because it IS a Пістолет ПМ. Thirty rounds was 3.6 bots per magazine and
; a reload that never arrived; eight makes the reload a rhythm and the ammo on the
; route worth picking up.
MagazineSize=8
; 1.8: with the auto-reload safety net gone, a manual-only reload at 2.2 s reads
; as punishment rather than as a decision.
ReloadSeconds=1.800000
; The tutorial's reload lesson, and the only one it costs nothing to teach.
; Auto-reload is gone (spec §3), so the button's empty-state pulse has to appear
; somewhere safe before it appears under fire. Three rounds means it appears at
; the spawn camp. Set it to -1 for a full magazine once raids stop teaching.
StartingMagazineRounds=3
MinFireIntervalSeconds=0.150000
AimFireDeadZone=0.350000
PocketGrid=(X=2,Y=2)
BackpackGrid=(X=4,Y=2)
InteractRadiusUU=250.000000
LootChannelSeconds=1.500000
ExtractDwellSeconds=5.000000
; Hunger and thirst (spec §4). 55/45 rather than 100/100 is the whole design: the
; character walked to the sector, and starting full means neither meter ever
; crosses its threshold inside fifteen minutes. Never lethal — the only penalty is
; the out-of-combat regeneration below, halved by one low meter and stopped by two.
FoodDrainPerMinute=2.500000
WaterDrainPerMinute=3.300000
FoodStartPercent=55.000000
WaterStartPercent=45.000000
SurvivalLowPercent=30.000000
SurvivalTickIntervalSeconds=0.250000
; Health had no way back up at all before this. 1.5 hp/s is 66 s for a full
; recovery, and a scav deals 21.5 hp/s — so it is fourteen times too slow to be
; felt in a fight, which is what keeps the medkit the in-combat answer.
HealthRegenPerSecond=1.500000
HealthRegenDelaySeconds=8.000000
WaterBottleRestoresWater=50.000000
CannedFoodRestoresFood=45.000000
; Vodka: a small heal that takes water with it. See the property's own comment.
VodkaHeals=15.000000
VodkaCostsWater=15.000000
bOfflineTutorialLoot=True
PostRaidReturnSeconds=5.000000
bBackendEnabled=True
; Quoted deliberately: the ini parser runs with SwallowDoubleSlashComments, so an
; unquoted value is truncated at the "//" of the scheme and the setting silently
; becomes "https:". Quotes suppress comment handling and are stripped from the
; value (FParse::QuotedString), so this loads as the full URL.
BackendBaseUrl="https://sarko-api-production.up.railway.app"
BackendMapId=bridge
BackendGraceMarginSeconds=120.000000
BackendTimeoutSeconds=10.000000
; THE NOISE MODEL (spec §7). How far each thing the player can do carries.
; These replaced EnemyHearingRadiusUU, which belonged to the listener and could
; therefore never be spent: inside it you were heard whatever you were doing.
; A shot is deliberately the widest number the AI knows — wider than the sector's
; post spacing, so firing CAN reach two encounters' posts. That is the price of
; shooting, not a hole in the "first fight is one bot" law: encounters gate
; spawning, noise only gates the behaviour of bots that already exist.
NoiseLoudRadiusUU=2600.000000
NoiseAudibleRadiusUU=1100.000000
NoiseQuietRadiusUU=450.000000
; Fraction of MaxWalkSpeed at which moving becomes running, and below which it
; stops counting as moving. The move stick's deflection already scales speed, so
; this IS a stick threshold — read off the server's own velocity, which no client
; can lie about.
NoiseRunSpeedFraction=0.700000
NoiseMoveSpeedFraction=0.150000
; Longer than the report interval, so a moving pawn is heard continuously rather
; than blinking in and out of earshot between reports.
NoiseEventLifetimeSeconds=0.750000
NoiseMovementIntervalSeconds=0.250000
; The FALLBACK listener sensitivity, for a bot with no archetype (map
; `botSpawns`). Every encounter-spawned bot gets its own from
; SarkoAI::GetBotArchetypes via ASarkoAIController::SetPerception.
EnemyHearingSensitivity=1.000000
; How far a bot can SEE. Not new behaviour — EnemyHearingRadiusUU used to bound
; sight as a side effect, and deleting it without this would have given every bot
; map-wide vision down any open sight line. 1600 is the landscape camera's
; measured lateral half-view: a bot sees you at about the distance you can see it.
EnemySightRangeUU=1600.000000
; Its own setting since the realism stage. It used to be WeaponRangeUU * 0.5 in
; SarkoAIController, i.e. 2000 uu, against a screen about 1090 uu across at the
; pawn's depth — so the first shot of a raid arrived from a bot the player could
; not see. 1100 sits inside the ~1380 uu of forward view, so a fight starts on
; screen or not at all (ТЗ §11).
EnemyFiringRangeUU=1100.000000
AIPatrolLeashUU=1400.000000
AIInvestigateArriveRadiusUU=250.000000
AIInvestigateTimeoutSeconds=12.000000
EncounterEvaluationIntervalSeconds=0.250000
EncounterMinSpawnDistanceUU=2600.000000
EncounterSpawnDeferSeconds=5.000000
; 1.3. Fewer enemies, each more dangerous: with WeaponDamage 28 that is 100 hp in
; 5.2 seconds — tense, and still escapable. The fallback for an unarchetyped bot,
; same as EnemyHearingRadiusUU above.
EnemyFireIntervalSeconds=1.300000
AIShootHysteresisRangeUU=150.000000
EnemyWalkSpeed=340.000000
AIAvoidanceTraceDistanceUU=150.000000
AIAvoidanceSteerDegrees=60.000000
AIAvoidanceWideSteerDegrees=120.000000
AIAvoidanceProbeRadiusUU=40.000000
AIStuckDisplacementThresholdUU=50.000000
AIStuckTimeThresholdSeconds=2.000000
bLogAIDiagnostics=False
; FEEDBACK WITHOUT SOUND (spec §4). Sound is its own stage; until then these four
; numbers are the only way the player learns that a hit happened, who landed it
; and from where. All of it is drawn (Canvas primitives and dynamic material
; instances) because this project authors no assets.
LowHealthVignetteHealth=30.000000
DamageArcSeconds=0.600000
HitMarkerSeconds=0.150000
HitFlashSeconds=0.100000

; UProjectPackagingSettings is UCLASS(config=Game) — verified in the engine
; header — and UAT/the cooker read this section from the GAME ini hierarchy.
; It lived in DefaultEngine.ini until 2026-08-03, where every line below was
; dead config: nothing applied, nothing warned. The Data line in particular
; meant bridge.json would have been absent from a device build, i.e. an empty
; raid, and the cook lines meant an invisible character and no ambient light.
; The map lives in Data/Maps/bridge.json and is read with FFileHelper at
; runtime, not cooked as a UAsset. Without staging that directory as non-UFS
; the file exists in the editor and is simply absent from a packaged build —
; a failure that only shows up on device, as an empty raid.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")

; The mannequin assets are reached only by LoadObject with a literal path, so
; nothing in the project hard-references them and the cooker has no reason to
; include them. Without this the character is visible in the editor and
; invisible in a packaged iOS build — the same class of failure as the
; non-UFS Data directory above, and just as invisible until you're on device.
+DirectoriesToAlwaysCook=(Path="/Game/Mannequins")

; The ambient cubemap is reached only by LoadObject with a literal path, so
; nothing in the project hard-references it and the cooker has no reason to
; include it — the same failure as the Mannequins line above: ambient light in
; the editor, none in a packaged iOS build, and nothing in any log to say so.
+DirectoriesToAlwaysCook=(Path="/Engine/MapTemplates/Sky")
