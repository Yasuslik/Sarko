bUseManualIPAddress=False
ManualIPAddress=

; The Epic Online Services SDK is not used by this project. It is initialised
; anyway, because EOSShared is an engine plugin that is enabled by default, and
; it then retries https://api.epicgames.dev on a backoff timer forever. On this
; machine that request fails certificate pinning, and each failure is logged at
; ERROR severity.
;
; That is not merely noise: UE's automation framework installs a log capture for
; the duration of each test and turns any Error logged while a test is running
; into a failure of THAT test. Because the EOS retry fires on its own timer, the
; test it lands on is whichever one happens to be executing — so a pure unit test
; with no network in it (Sarko.Shelter.ViewSeparatesUnknownFromEmpty was the
; observed victim) fails once and passes on re-run. A flaky suite is worse than a
; missing test, and nothing in this project reads LogEOSSDK.
;
; Fatal, not NoLogging: a genuine crash inside the SDK still speaks.
[Core.Log]
LogEOSSDK=Fatal

; ============================================================================
; iOS.
;
; The project's first iOS configuration. Until now there was none at all, so
; every value here was whatever Engine/Config/BaseEngine.ini happened to say —
; including the bundle identifier, which was still com.YourCompany.Sarko.
;
; WHY THIS SECTION IS IN DefaultENGINE.ini
;
; Same question the packaging block in DefaultGame.ini got wrong for weeks, and
; the same way of answering it — read the class, not the habit:
;
;   * UIOSRuntimeSettings is UCLASS(config=Engine, defaultconfig), in
;     Engine/Source/Runtime/IOS/IOSRuntimeSettings/Classes/IOSRuntimeSettings.h.
;     config=Engine is the Engine ini hierarchy; defaultconfig is what makes the
;     editor's Project Settings > iOS page write back to THIS file.
;   * UnrealBuildTool agrees without being asked. Every key below is declared in
;     Platform/IOS/UEBuildIOS.cs as
;       [ConfigFile(ConfigHierarchyType.Engine,
;                   "/Script/IOSRuntimeSettings.IOSRuntimeSettings", "<key>")]
;     and UEDeployIOS.WritePlistFile — which turns the orientation flags below
;     into UISupportedInterfaceOrientations in Info.plist — opens the hierarchy
;     with ConfigCache.ReadHierarchy(ConfigHierarchyType.Engine, ...).
;
; So in DefaultGame.ini these lines would parse, apply to nothing, and warn
; about nothing: a build that installs under the wrong bundle id and rotates
; into portrait, with nothing anywhere saying why. Exactly the failure mode
; Sarko.Config.PackagingSettingsLiveInTheGameIni exists to prevent for the
; other direction. (Its mirror image applies here: these keys must NOT be
; copied into DefaultGame.ini "to be safe".)
;
; Not Config/IOS/IOSEngine.ini either. That file is real — it is the layer
; "{PROJECT}/Config/{PLATFORM}/{PLATFORM}{TYPE}.ini" in GConfigLayers,
; Core/Public/Misc/ConfigHierarchy.h — but it sits ABOVE Default*.ini in the
; hierarchy, while `defaultconfig` sends the editor's writes to DefaultEngine.ini.
; Split across both, the platform file would silently outrank whatever the
; editor wrote and the settings page would look like it forgets its own values.
; One home, and it is the one the tool writes to.
;
; (Config/IOS/DefaultIOS.ini, which the task described, is not a layer the
; engine reads at all — there is no {TYPE} named "IOS". A file by that name
; would be inert in the most literal sense: never opened.)
[/Script/IOSRuntimeSettings.IOSRuntimeSettings]

; Landscape, both ways up, no portrait — the whole game is landscape.
;
; BaseEngine.ini already defaults to exactly this, which is precisely why it is
; written out here: an engine default is not a project decision, it is a
; coincidence that currently agrees with one, and this is the setting the whole
; UI was just re-laid-out for.
;
; Both landscape orientations rather than one so the phone can be held either
; way up; PreferredLandscapeOrientation only decides which one a fresh launch
; picks when the device is flat. LandscapeRight (home indicator to the right)
; is Apple's own default and puts the Dynamic Island on the left, which is the
; side the HUD's safe-area insets were checked against.
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeRight

; Identity. The bundle identifier has to be unique per Apple ID; this one is a
; reverse-DNS name nobody else is using rather than a domain the project owns,
; and it should be changed if a real domain ever exists. [PROJECT_NAME] is not
; used, because a literal is greppable and a substitution is not.
BundleIdentifier=com.ruslanbondarenko.sarko
BundleName=Sarko
BundleDisplayName=Sarko
VersionInfo=0.1.0

; 16.0, not the engine minimum of 15.0: it is the floor for Metal 3 and it
; drops nothing anyone will run this on. Written as the EIOSVersion enum NAME
; (see IOSRuntimeSettings.h) — UEDeployIOS.GetMinimumiOSVersion switches on the
; string, and an unrecognised one silently falls back to 15.0 with a log line.
MinimumiOSVersion=IOS_16

; A phone game, but there is no reason an iPad cannot run it in landscape, and
; refusing to install on one is a decision with no upside.
bSupportsIPhone=True
bSupportsIPad=True

; SIGNING, for a free Apple ID.
;
; Automatic: Xcode manages the certificate and the provisioning profile itself,
; which is the only mode a free (personal-team) Apple ID has — that account type
; cannot create the explicit distribution profiles the manual path wants, and
; its certificates last 7 days. Nothing here needs a paid Developer Program
; membership.
;
; Deliberately EMPTY, and it must stay empty until a personal team is added.
;
; The only signing identity on this machine belongs to an organisation team
; (GM UniverseApps Limited, CNZ9UGBFKN — the owner's employer). Building with
; it registers this iPhone in the company's device list, creates the App ID
; com.ruslanbondarenko.sarko in the company's portal, and leaves a provisioning
; profile there — all visible to anyone with admin rights, and the device slot
; is a limited yearly resource. A personal project must not do that.
;
; The fix is free: add a PERSONAL Apple ID in Xcode > Settings > Accounts, and
; put that team's id here. Personal teams give 7-day certificates and up to
; three apps per device, which is everything local device testing needs.
;
; Y3ZJGW8FX6 is the owner's PERSONAL free team (isFreeProvisioningTeam = 1),
; added 2026-08-04. The organisation team CNZ9UGBFKN that also exists on this
; machine must never be used: it would register the phone and the App ID in
; the employer's portal. If this value is ever empty again, the build fails
; with "Signing for SarkoGame requires a development team" — which is the
; intended outcome, because failing loudly beats signing with someone else's
; account.
IOSTeamID=Y3ZJGW8FX6

; This game sells nothing and tracks nobody. Both of these default to on in
; BaseEngine.ini, and both of them are things an App Store submission has to
; declare — StoreKit brings in the in-app-purchase framework, and the
; advertising identifier is an IDFA privacy disclosure.
bEnableStoreKitSupport=False
bEnableAdvertisingIdentifier=False

; Xcode project generation reads the signing team from HERE, not from
; IOSTeamID above. UBT's XcodeProject.cs:2067 does
;   PlatformIni.TryGetValue("/Script/MacTargetPlatform.XcodeProjectSettings",
;                           "CodeSigningTeam", out SigningTeam)
; and writes it straight into DEVELOPMENT_TEAM in the generated xcconfig.
; IOSRuntimeSettings.IOSTeamID feeds the older provisioning-lookup path only,
; so setting that alone leaves DEVELOPMENT_TEAM empty and Xcode answers
; "Signing for SarkoGame requires a development team" — which cost an hour to
; find. Both are set, and both must name the PERSONAL team Y3ZJGW8FX6.
[/Script/MacTargetPlatform.XcodeProjectSettings]
bUseAutomaticCodeSigning=True
CodeSigningTeam=Y3ZJGW8FX6
; Same story as the team: the generator reads the bundle id from HERE
; (XcodeProject.cs:529), and only falls back to
; "$(UE_SIGNING_PREFIX).$(UE_PRODUCT_NAME_STRIPPED)" — which resolved to
; com.YourCompany.SarkoGame and made Xcode hunt for a profile nobody owns.
; IOSRuntimeSettings.BundleIdentifier above does not reach this path.
BundleIdentifier=com.ruslanbondarenko.sarko
