[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Sarko

; UGameMapsSettings is UCLASS(config=Engine), so this section must live here
; and not in DefaultGame.ini — that misplacement was a pre-existing bug that
; silently left SarkoRaidGameMode unloaded (GameModeBase every launch, no
; map, no enemies, nothing spawned at all).
[/Script/EngineSettings.GameMapsSettings]
; Boot lands in the shelter (spec §6.5: boot -> shelter -> "В РЕЙД" -> raid ->
; outcome -> shelter). The raid is reached by a `game=` option on the travel URL,
; which UGameInstance::CreateGameModeForURL resolves ahead of this line; the
; return trip carries no options and therefore falls back to it.
GlobalDefaultGameMode=/Script/SarkoGame.SarkoShelterGameMode
; The engine's own empty level, used purely as a container: this project
; authors no .umap, and every piece of geometry is spawned from C++ by
; SarkoRaidGameMode. Without a default map the game has nothing to load and
; will not start at all.
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
; UGameInstance survives LoadMap, and it is the only thing that does. The JWT,
; the fetched profile and the last raid's outcome all live here, because a level
; travel destroys every actor including the game mode that knew them.
; UGameMapsSettings is config=Engine, which is why this line is in this file.
GameInstanceClass=/Script/SarkoGame.SarkoGameInstance

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.MobileHDR=False

; Lumen and Nanite off, as the design spec requires for a mobile target. This
; was specified but never actually configured, and the omission was visible:
; Lumen tries to compute dynamic global illumination from runtime-spawned
; movable lights in a level with no sky, and fills the screen with grain.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Lumen.Supported=0
r.Nanite.ProjectEnabled=False

; No virtual shadow maps either — they are Lumen-era machinery and cost more
; than a grey-box slice needs on a phone.
;r.Shadow.Virtual.Enable=0 ; re-enabled: without VSM a movable directional light casts no shadow, and top-down grey boxes on a grey floor become invisible

; Fixed exposure. Auto-exposure hunts for a target brightness, and in a scene
; that is mostly flat grey it settles somewhere arbitrary and drifts as the
; player turns — which reads as the lighting being broken.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False

; These assets were copied in from another project's Content/Characters/Mannequins,
; so every internal reference they carry — mesh to material, animation to
; skeleton — still points at /Game/Characters/Mannequins/..., which does not
; exist here. Left unredirected the meshes load with no materials and the
; sequences cannot find their skeleton, i.e. an untextured character in a
; T-pose. Fixed in config rather than by resaving the assets, because this
; project does not author or edit binary assets.
[CoreRedirects]
+PackageRedirects=(OldName="/Game/Characters/Mannequins",NewName="/Game/Mannequins",MatchSubstring=true)

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=62F3C855DD416728674D94B9D40C364D
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
