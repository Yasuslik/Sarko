; Per-platform texture caps for the character assets.
;
; Epic's mannequins ship at source resolutions meant for a cinematic close-up:
; every texture is 1024x1024 except T_Manny_02_BN, whose source is 4096x4096
; (21 MB on disk as a .uasset). This game is top-down on a phone — a pawn
; occupies roughly 100 px of a 1080p-class screen — so shipping even the 1K
; maps at full size, let alone the 4K one, is paying for detail no player can
; resolve.
;
; Capped here rather than by editing the assets: a texture group's MaxLODSize is
; applied when the platform's texture data is built, so the cook drops the top
; mips and the shipped iOS build carries 512x512 while the Mac editor (and every
; screenshot taken from it) still sees the originals. No .uasset is touched.
;
; 512 rather than 256: at 512 a pawn's texel density is still about five times
; the screen space it occupies, which leaves headroom for the eventual
; close-up-on-death or inventory-portrait use without a re-cook decision.
;
; The three groups below are the ones these assets actually declare
; (TEXTUREGROUP_Character on the diffuse maps, CharacterNormalMap on the
; normals, CharacterSpecular on the packed MRA maps). TEXTUREGROUP_World is
; deliberately left alone — two of the Manny 02 maps are misfiled into it
; upstream, and capping the world group to punish them would also cap the
; map geometry's textures.
;
; DeviceProfile arrays are keyed by Group (see [DeviceProfile] *TextureLODGroups
; in the engine's BaseDeviceProfiles.ini), so these entries replace the
; inherited GlobalDefaults ones rather than adding duplicates.

[IOS DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=512,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=512,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=512,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
